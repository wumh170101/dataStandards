<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>数据标准管理 | 标准详情 · 映射配置 · 落标检查</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #1a2c3e;
            padding: 1rem;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            max-width: 1600px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #cfdfed;
            padding-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .title h1 {
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1f5e8e, #2b8bb3);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .title p {
            color: #5b7d9e;
            font-size: 0.7rem;
            margin-top: 0.2rem;
        }

        .btn-primary {
            background: #1f6392;
            border: none;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .btn-primary:hover { background: #0f4b70; }

        .btn-secondary {
            background: #eef2f8;
            border: 1px solid #caddf0;
            color: #2b5b82;
            padding: 0.35rem 0.9rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #b9cfe5;
            padding: 0.25rem 0.7rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .btn-danger {
            background: #fff3f0;
            border: 1px solid #f0cdc4;
            color: #c23d22;
        }

        .two-columns {
            display: flex;
            gap: 1rem;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .left-panel {
            width: 300px;
            flex-shrink: 0;
            background: white;
            border-radius: 20px;
            border: 1px solid #e2edf3;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .right-panel {
            flex: 1;
            background: white;
            border-radius: 20px;
            border: 1px solid #e2edf3;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid #eef3f8;
            background: #fafdff;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .scroll-area {
            overflow-y: auto;
            flex: 1;
            padding: 0.5rem;
        }

        .standard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0.8rem;
            margin: 4px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.1s;
            border-left: 3px solid transparent;
        }

        .standard-item:hover { background: #f0f7fc; }
        .standard-item.active {
            background: #e2f0f9;
            border-left-color: #2b8bb3;
        }

        .indicator-badge {
            display: inline-block;
            padding: 0.15rem 0.4rem;
            border-radius: 30px;
            font-size: 0.6rem;
        }
        .badge-yes { background: #e2f3e4; color: #2c6e3c; }
        .badge-no { background: #f0eef2; color: #8b7a9e; }

        .tag {
            background: #eef2fa;
            padding: 0.15rem 0.4rem;
            border-radius: 12px;
            font-size: 0.65rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #8ba6be;
            font-size: 0.8rem;
        }

        /* Tab 样式 */
        .tabs {
            display: flex;
            border-bottom: 1px solid #eef3f8;
            background: #fafdff;
            padding: 0 1rem;
            flex-shrink: 0;
        }
        .tab {
            padding: 0.6rem 1.2rem;
            font-size: 0.75rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.1s;
            color: #6e95b5;
        }
        .tab:hover { color: #1f6392; }
        .tab.active {
            color: #1f6392;
            border-bottom-color: #1f6392;
            font-weight: 600;
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        /* 表单样式 */
        .form-group { margin-bottom: 0.8rem; }
        label {
            font-weight: 600;
            font-size: 0.7rem;
            display: block;
            margin-bottom: 0.2rem;
            color: #2b5b82;
        }
        .label-required::after { content: " *"; color: #e26d5a; }
        input, select, textarea {
            width: 100%;
            padding: 0.4rem 0.6rem;
            border-radius: 10px;
            border: 1px solid #caddf0;
            font-size: 0.75rem;
            background: #fff;
        }
        .row-2col { display: flex; gap: 0.8rem; }
        .row-3col { display: flex; gap: 0.8rem; }

        .attr-card {
            background: #f9fdfe;
            border-radius: 14px;
            padding: 0.6rem;
            margin-bottom: 0.8rem;
            border: 1px solid #e3f0f5;
        }
        .attr-title {
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #1f5e7e;
            padding-left: 0.3rem;
            border-left: 3px solid #2b8bb3;
        }

        .button-bar {
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid #eef2f7;
        }

        .info-note {
            background: #eaf5fb;
            padding: 0.4rem;
            border-radius: 12px;
            font-size: 0.65rem;
            margin-top: 0.6rem;
        }

        /* 进度条导航 */
        .progress-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-bottom: 1rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eef3f8;
            background: #fafdff;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .progress-item {
            padding: 0.3rem 0.9rem;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.1s;
            background: #eef2fa;
            color: #5b7d9e;
        }
        .progress-item:hover {
            background: #e2f0f9;
            color: #1f6392;
        }
        .progress-item.active {
            background: #1f6392;
            color: white;
        }

        /* 锚点区域标识 */
        .section-anchor {
            scroll-margin-top: 80px;
        }

        /* 资产树样式 - 支持多选 */
        .asset-tree { max-height: 400px; overflow-y: auto; }
        .system-node, .table-node, .field-node {
            padding: 0.4rem 0.6rem;
            margin: 2px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .system-node:hover, .table-node:hover, .field-node:hover { background: #f0f7fc; }
        .field-node { margin-left: 2rem; }
        .field-checkbox { width: 14px; height: 14px; cursor: pointer; }
        .field-name { flex: 1; cursor: pointer; }

        .selection-info {
            font-size: 0.65rem;
            color: #1f6392;
            margin-left: 0.5rem;
        }
        .batch-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .mapping-list { max-height: 250px; overflow-y: auto; }
        .mapping-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem;
            border-bottom: 1px solid #eef3f8;
            font-size: 0.7rem;
        }
        .mapping-checkbox { margin-right: 0.5rem; }

        .compliance-summary {
            background: linear-gradient(135deg, #f0f9ff, #e8f4f8);
            border-radius: 16px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .compliance-rate { font-size: 2rem; font-weight: 700; }
        .rate-high { color: #2c6e3c; }
        .rate-medium { color: #e68a2e; }
        .rate-low { color: #c23d22; }

        .report-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
        .report-table th, .report-table td { padding: 0.4rem; text-align: left; border-bottom: 1px solid #eef3f8; }
        .fail-item { background: #fff3f0; }

        .security-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 30px; font-size: 0.65rem; }
        .security-important { background: #fff3e0; color: #c47d2e; }
        .security-sensitive { background: #ffe6e0; color: #c23d22; }
        .security-normal { background: #eef2fa; color: #5b7d9e; }

        .yes-no-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 30px; font-size: 0.65rem; background: #eef2fa; }
        .yes-badge { background: #e2f3e4; color: #2c6e3c; }
        .no-badge { background: #f0eef2; color: #8b7a9e; }

        .version-list { max-height: 300px; overflow-y: auto; }
        .version-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.5rem; border-bottom: 1px solid #eef3f8;
        }
        .version-current { background: #e2f0f9; }

        /* 弹窗样式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-container {
            background: white; width: 780px; max-width: 90%; max-height: 85vh;
            border-radius: 24px; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        }
        .modal-header {
            padding: 1rem 1.5rem; background: #fafdff; border-bottom: 1px solid #eef2f8;
            font-weight: 700; font-size: 1rem; display: flex; justify-content: space-between;
        }
        .modal-body { padding: 1.2rem 1.5rem; overflow-y: auto; }
        .modal-footer {
            padding: 0.8rem 1.5rem; border-top: 1px solid #eef2f8;
            display: flex; justify-content: flex-end; gap: 0.8rem;
        }
        .modal-tabs {
            display: flex; border-bottom: 1px solid #eef3f8; background: #fafdff;
            padding: 0 1rem; flex-shrink: 0;
        }
        .modal-tab {
            padding: 0.5rem 1rem; font-size: 0.7rem; cursor: pointer;
            border-bottom: 2px solid transparent; color: #6e95b5;
        }
        .modal-tab:hover { color: #1f6392; }
        .modal-tab.active { color: #1f6392; border-bottom-color: #1f6392; font-weight: 600; }
        .modal-tab-content { padding: 1rem 0; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="title">
            <h1>📋 数据标准管理</h1>
            <p>标准详情 · 映射配置（支持多选） · 落标检查 · 版本管理</p>
        </div>
        <button class="btn-primary" id="createStandardBtn">+ 新建标准</button>
    </div>

    <div class="two-columns">
        <div class="left-panel">
            <div class="panel-header">
                <span>📌 标准列表</span>
                <span class="tag" id="totalCount">0个标准</span>
            </div>
            <div class="scroll-area" id="standardListContainer"></div>
        </div>

        <div class="right-panel">
            <div class="tabs" id="tabs">
                <div class="tab active" data-tab="basic">标准详情</div>
                <div class="tab" data-tab="mapping">映射配置</div>
                <div class="tab" data-tab="compliance">落标检查</div>
                <div class="tab" data-tab="version">版本历史</div>
            </div>
            <div id="tabContent" class="tab-content">
                <div class="empty-state">✨ 请从左侧选择标准</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== 保留原有 Mock 数据 ====================
    let standards = [
        { 
            id: "std1", name: "手机号字段标准", englishName: "MobilePhoneStandard", code: "STD_MOBILE", version: "v1.0",
            isIndicator: false,
            business: { definition: "存储用户手机号码，用于登录验证", owner: "王芳" },
            tech: { dataType: "VARCHAR", length: "11", precision: "", format: "纯数字", required: "是", unique: "否", valueRange: "^1[3-9]\\d{9}$" },
            manage: { department: "数据治理部", manager: "张明" },
            security: { level: "敏感" },
            createTime: "2025-01-10"
        },
        { 
            id: "std2", name: "订单金额字段标准", englishName: "OrderAmountStandard", code: "STD_AMOUNT", version: "v1.0",
            isIndicator: false,
            business: { definition: "订单实际支付金额，单位元", owner: "李雷" },
            tech: { dataType: "DECIMAL", length: "18", precision: "2", format: "两位小数", required: "是", unique: "否", valueRange: "≥0" },
            manage: { department: "财务数据部", manager: "韩梅梅" },
            security: { level: "重要" },
            createTime: "2025-01-10"
        },
        { 
            id: "std3", name: "日活跃用户数(DAU)", englishName: "DailyActiveUsers", code: "STD_DAU", version: "v1.0",
            isIndicator: true,
            indicator: { period: "日", formula: "COUNT(DISTINCT user_id) WHERE login_date = 统计日" },
            business: { definition: "当日至少有一次登录行为的去重用户数", owner: "张运营" },
            tech: { dataType: "BIGINT", length: "", precision: "", format: "", required: "是", unique: "否", valueRange: "100万-500万" },
            manage: { department: "运营数据部", manager: "赵数据" },
            security: { level: "其他一般" },
            createTime: "2025-01-10"
        }
    ];

    // 资产数据
    const assetData = {
        systems: [
            { id: "sys1", name: "订单系统", tables: [
                { id: "tbl1_1", name: "order_info", fields: [
                    { id: "fld1_1_1", name: "order_id", type: "VARCHAR", length: "32" },
                    { id: "fld1_1_2", name: "mobile", type: "VARCHAR", length: "11" },
                    { id: "fld1_1_3", name: "order_amount", type: "DECIMAL", length: "18", precision: "2" }
                ] },
                { id: "tbl1_2", name: "order_detail", fields: [
                    { id: "fld1_2_1", name: "amount", type: "DECIMAL", length: "18", precision: "2" }
                ] }
            ] },
            { id: "sys2", name: "用户中心", tables: [
                { id: "tbl2_1", name: "user_info", fields: [
                    { id: "fld2_1_1", name: "user_id", type: "VARCHAR", length: "32" },
                    { id: "fld2_1_2", name: "phone_number", type: "VARCHAR", length: "11" },
                    { id: "fld2_1_3", name: "cellphone", type: "VARCHAR", length: "20" }
                ] }
            ] }
        ]
    };

    let mappings = {};
    let selectedStandardId = "std1";
    let currentTab = "basic";
    let allVersions = [
        { id: "std1_v1", baseId: "std1", name: "手机号字段标准", version: "v1.0", createTime: "2025-01-10" },
        { id: "std2_v1", baseId: "std2", name: "订单金额字段标准", version: "v1.0", createTime: "2025-01-10" },
        { id: "std3_v1", baseId: "std3", name: "日活跃用户数(DAU)", version: "v1.0", createTime: "2025-01-10" }
    ];

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
    function getStandardById(id) { return standards.find(s => s.id === id); }
    function getSecurityClass(level) {
        if (level === '重要') return 'security-important';
        if (level === '敏感') return 'security-sensitive';
        return 'security-normal';
    }
    function getYesNoClass(value) { return value === '是' ? 'yes-badge' : 'no-badge'; }

    function renderStandardList() {
        const container = document.getElementById('standardListContainer');
        container.innerHTML = standards.map(s => `
            <div class="standard-item ${selectedStandardId === s.id ? 'active' : ''}" data-id="${s.id}">
                <div><strong>${escapeHtml(s.name)}</strong><div style="font-size:0.65rem;">${escapeHtml(s.code)}</div></div>
                <div><span class="indicator-badge ${s.isIndicator ? 'badge-yes' : 'badge-no'}">${s.isIndicator ? '指标' : '字段'}</span><div class="tag">${s.version}</div></div>
            </div>
        `).join('');
        document.querySelectorAll('.standard-item').forEach(el => {
            el.addEventListener('click', () => { selectedStandardId = el.dataset.id; renderStandardList(); renderCurrentTab(); });
        });
        document.getElementById('totalCount').innerText = standards.length + '个标准';
    }

    function renderCurrentTab() {
        if (currentTab === 'basic') renderStandardDetailTab();
        else if (currentTab === 'mapping') renderMappingTab();
        else if (currentTab === 'compliance') renderComplianceTab();
        else if (currentTab === 'version') renderVersionTab();
    }

    // 标准详情 Tab（原基本信息Tab，包含进度条导航）
    function renderStandardDetailTab() {
        const std = getStandardById(selectedStandardId);
        if (!std) { document.getElementById('tabContent').innerHTML = '<div class="empty-state">标准不存在</div>'; return; }
        const isIndicator = std.isIndicator;
        
        // 定义进度条项目
        const progressItems = [
            { id: "basicInfo", label: "基本信息" },
            { id: "businessAttr", label: "业务属性" },
            { id: "techAttr", label: "技术属性" },
            { id: "manageAttr", label: "管理属性" },
            { id: "securityAttr", label: "安全属性" }
        ];
        if (isIndicator) {
            progressItems.push({ id: "indicatorAttr", label: "指标属性" });
        }
        
        let html = `
            <div style="display:flex; justify-content:flex-end; margin-bottom:1rem;">
                <button class="btn-outline" id="editBasicBtn">✏️ 编辑标准</button>
            </div>
            
            <!-- 进度条导航 -->
            <div class="progress-nav" id="progressNav">
                ${progressItems.map(item => `<span class="progress-item" data-target="${item.id}">${item.label}</span>`).join('')}
            </div>
            
            <!-- 基本信息区域 -->
            <div id="basicInfo" class="section-anchor">
                <div class="attr-card">
                    <div class="attr-title">📋 基本信息</div>
                    <div class="row-2col" style="margin-bottom:0.5rem;">
                        <div><label>标准名称</label><div>${escapeHtml(std.name)}</div></div>
                        <div><label>标准英文名</label><div>${escapeHtml(std.englishName || '—')}</div></div>
                        <div><label>标准编码</label><div>${escapeHtml(std.code)}</div></div>
                    </div>
                    <div><label>说明</label><div>${escapeHtml(std.description || '—')}</div></div>
                    <div style="margin-top:0.5rem;"><label>🏷️ 指标标签</label><div><span class="indicator-badge ${std.isIndicator ? 'badge-yes' : 'badge-no'}">${std.isIndicator ? '是' : '否'}</span></div></div>
                </div>
            </div>
            
            <!-- 业务属性区域 -->
            <div id="businessAttr" class="section-anchor">
                <div class="attr-card">
                    <div class="attr-title">🧾 业务属性</div>
                    <div class="row-2col">
                        <div><label>业务定义</label><div>${escapeHtml(std.business?.definition || '—')}</div></div>
                        <div><label>业务负责人</label><div>${escapeHtml(std.business?.owner || '—')}</div></div>
                    </div>
                </div>
            </div>
            
            <!-- 技术属性区域 -->
            <div id="techAttr" class="section-anchor">
                <div class="attr-card">
                    <div class="attr-title">⚙️ 技术属性</div>
                    <div class="row-3col">
                        <div><label>数据类型</label><div>${escapeHtml(std.tech?.dataType || '—')}</div></div>
                        <div><label>长度</label><div>${escapeHtml(std.tech?.length || '—')}</div></div>
                        <div><label>精度</label><div>${escapeHtml(std.tech?.precision || '—')}</div></div>
                    </div>
                    <div class="row-3col" style="margin-top:0.4rem;">
                        <div><label>显示格式</label><div>${escapeHtml(std.tech?.format || '—')}</div></div>
                        <div><label>必填</label><div><span class="yes-no-badge ${getYesNoClass(std.tech?.required)}">${std.tech?.required || '否'}</span></div></div>
                        <div><label>唯一</label><div><span class="yes-no-badge ${getYesNoClass(std.tech?.unique)}">${std.tech?.unique || '否'}</span></div></div>
                    </div>
                    <div><label>值域</label><div>${escapeHtml(std.tech?.valueRange || '—')}</div></div>
                </div>
            </div>
            
            <!-- 管理属性区域 -->
            <div id="manageAttr" class="section-anchor">
                <div class="attr-card">
                    <div class="attr-title">📋 管理属性</div>
                    <div class="row-2col">
                        <div><label>管理部门</label><div>${escapeHtml(std.manage?.department || '—')}</div></div>
                        <div><label>管理人</label><div>${escapeHtml(std.manage?.manager || '—')}</div></div>
                    </div>
                </div>
            </div>
            
            <!-- 安全属性区域 -->
            <div id="securityAttr" class="section-anchor">
                <div class="attr-card">
                    <div class="attr-title">🔐 安全属性</div>

                        <div class="row-2col">

                            <div><label>计算公式</label><div>${escapeHtml(std.indicator?.formula || '—')}</div></div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        document.getElementById('tabContent').innerHTML = html;
        
        // 绑定进度条点击滚动事件
        const progressItemsDom = document.querySelectorAll('.progress-item');
        progressItemsDom.forEach(item => {
            item.addEventListener('click', () => {
                const targetId = item.dataset.target;
                const targetElement = document.getElementById(targetId);
                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    // 高亮当前点击的进度项
                    progressItemsDom.forEach(p => p.classList.remove('active'));
                    item.classList.add('active');
                    setTimeout(() => { item.classList.remove('active'); }, 2000);
                }
            });
        });
        
        // 滚动时自动高亮当前可见区域的进度项
        const tabContent = document.getElementById('tabContent');
        const observerOptions = { root: tabContent, threshold: 0.3 };
        const observerCallback = (entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.id;
                    progressItemsDom.forEach(item => {
                        if (item.dataset.target === id) item.classList.add('active');
                        else item.classList.remove('active');
                    });
                }
            });
        };
        const observer = new IntersectionObserver(observerCallback, observerOptions);
        const anchors = document.querySelectorAll('.section-anchor');
        anchors.forEach(anchor => observer.observe(anchor));
        
        document.getElementById('editBasicBtn')?.addEventListener('click', () => openEditDialog(std));
    }

                        treeHtml += `<div class="field-node" data-field='${JSON.stringify({id:fld.id, name:fld.name, type:fld.type, length:fld.length, tableId:tbl.id, tableName:tbl.name, systemId:sys.id, systemName:sys.name})}'>

                    });
                    treeHtml += `</div>`;
                });
                treeHtml += `</div>`;
            });
            document.getElementById('assetTree').innerHTML = treeHtml;
            
            document.querySelectorAll('.field-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const fieldId = cb.dataset.fieldId;
                    fieldCheckStates[fieldId] = cb.checked;
                    updateSelectionCount();
                    e.stopPropagation();
                });
            });
            document.querySelectorAll('.field-name').forEach(name => {
                name.addEventListener('click', (e) => {
                    const checkbox = name.parentElement.querySelector('.field-checkbox');
                    if (checkbox) {
                        checkbox.checked = !checkbox.checked;
                        fieldCheckStates[checkbox.dataset.fieldId] = checkbox.checked;
                        updateSelectionCount();
                    }
                    e.stopPropagation();
                });
            });
            updateSelectionCount();
        }
        
        function updateSelectionCount() {
            const count = Object.values(fieldCheckStates).filter(v => v === true).length;
            const span = document.getElementById('selectionCount');
            if (span) span.innerText = `(已选${count}个字段)`;
        }
        
        renderAssetTreeWithCheckboxes();
        
        document.getElementById('selectAllFieldsBtn')?.addEventListener('click', () => {
            document.querySelectorAll('.field-checkbox').forEach(cb => {
                cb.checked = true;
                fieldCheckStates[cb.dataset.fieldId] = true;
            });
            updateSelectionCount();
        });
        
        document.getElementById('clearSelectionBtn')?.addEventListener('click', () => {
            document.querySelectorAll('.field-checkbox').forEach(cb => {
                cb.checked = false;
                fieldCheckStates[cb.dataset.fieldId] = false;
            });
            updateSelectionCount();
        });
        
        function renderMappingList() {
            const currentMappings = mappings[selectedStandardId] || [];
            const mappingContainer = document.getElementById('mappingList');
            if (!mappingContainer) return;
            if (currentMappings.length === 0) {
                mappingContainer.innerHTML = '<div class="empty-state">暂无映射，请从左侧选择字段添加</div>';
                return;
            }
            mappingContainer.innerHTML = currentMappings.map((m, idx) => `
                <div class="mapping-item">
                    <div><input type="checkbox" class="mapping-checkbox" data-idx="${idx}"> <span class="tag">${escapeHtml(m.systemName)}</span> → ${escapeHtml(m.tableName)}.${escapeHtml(m.name)} (${m.type})</div>
                    <button class="btn-outline remove-single-mapping" data-idx="${idx}" style="color:#c23d22;">移除</button>
                </div>
            `).join('');
            document.querySelectorAll('.remove-single-mapping').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    if (!isNaN(idx) && mappings[selectedStandardId]) {
                        mappings[selectedStandardId].splice(idx, 1);
                        renderMappingList();
                    }
                });
            });
        }
        renderMappingList();
        
        document.getElementById('batchRemoveMappingsBtn')?.addEventListener('click', () => {
            const checkedBoxes = document.querySelectorAll('.mapping-checkbox:checked');
            if (checkedBoxes.length === 0) { alert("请先勾选要移除的映射"); return; }
            const indicesToRemove = Array.from(checkedBoxes).map(cb => parseInt(cb.dataset.idx)).sort((a,b)=>b-a);
            indicesToRemove.forEach(idx => { mappings[selectedStandardId].splice(idx, 1); });
            renderMappingList();
        });
        
        document.getElementById('addSelectedMappingsBtn')?.addEventListener('click', () => {
            const selectedFields = [];
            document.querySelectorAll('.field-checkbox:checked').forEach(cb => {
                const fieldDiv = cb.closest('.field-node');
                if (fieldDiv) {
                    const fieldData = JSON.parse(fieldDiv.dataset.field);
                    selectedFields.push(fieldData);
                }
            });
            if (selectedFields.length === 0) { alert("请先勾选要添加的字段"); return; }
            if (!mappings[selectedStandardId]) mappings[selectedStandardId] = [];
            let addedCount = 0;
            selectedFields.forEach(field => {
                if (!mappings[selectedStandardId].some(m => m.id === field.id && m.tableId === field.tableId)) {
                    mappings[selectedStandardId].push(field);
                    addedCount++;
                }
            });
            if (addedCount > 0) {
                document.querySelectorAll('.field-checkbox:checked').forEach(cb => {
                    cb.checked = false;
                    fieldCheckStates[cb.dataset.fieldId] = false;
                });
                updateSelectionCount();
                renderMappingList();
                alert(`✅ 成功添加 ${addedCount} 个字段映射`);
            } else { alert("所选字段均已存在映射"); }
        });
    }

    function renderComplianceTab() {
        const std = getStandardById(selectedStandardId);
        if (!std) return;
        const stdMappings = mappings[selectedStandardId] || [];
        let html = `<div class="button-bar" style="justify-content:center;"><button class="btn-primary" id="runComplianceBtn">▶ 执行落标检查</button></div><div id="complianceResult"></div>`;
        document.getElementById('tabContent').innerHTML = html;
        document.getElementById('runComplianceBtn').addEventListener('click', () => {
            if (stdMappings.length === 0) { document.getElementById('complianceResult').innerHTML = '<div class="info-note">⚠️ 请先在「映射配置」中添加映射关系</div>'; return; }
            let totalChecks = 0, passCount = 0, typePass = 0, typeTotal = 0, formatPass = 0, formatTotal = 0, failDetails = [];
            stdMappings.forEach(m => {
                typeTotal++; totalChecks++;
                if ((std.tech?.dataType === 'VARCHAR' && (m.type === 'VARCHAR' || m.type === 'STRING')) ||
                    (std.tech?.dataType === 'DECIMAL' && m.type === 'DECIMAL') ||
                    (std.tech?.dataType === 'BIGINT' && (m.type === 'BIGINT' || m.type === 'INT')) ||
                    std.tech?.dataType === m.type) { typePass++; passCount++; } 
                else { failDetails.push({ field: m.name, issue: `数据类型不匹配，期望${std.tech?.dataType}，实际${m.type}` }); }
                formatTotal++; totalChecks++;
                if (Math.random() > 0.25) { formatPass++; passCount++; } 
                else { failDetails.push({ field: m.name, issue: `值域/格式校验失败，期望匹配标准约束` }); }
            });
            const overallRate = totalChecks > 0 ? (passCount / totalChecks * 100).toFixed(1) : 0;
            const rateClass = overallRate >= 80 ? 'rate-high' : (overallRate >= 60 ? 'rate-medium' : 'rate-low');
            let resultHtml = `<div class="compliance-summary"><div>📊 整体落标率</div><div class="compliance-rate ${rateClass}">${overallRate}%</div><div>检查项: ${totalChecks} | 通过: ${passCount} | 未达标: ${totalChecks - passCount}</div></div>
            <table class="report-table"><thead><tr><th>检查维度</th><th>达标情况</th><th>通过率</th></tr></thead><tbody>
            <tr><td>数据类型检查</td><td>${typePass}/${typeTotal}</td><td>${typeTotal>0?(typePass/typeTotal*100).toFixed(0):0}%</td></tr>
            <tr><td>值域/格式检查</td><td>${formatPass}/${formatTotal}</td><td>${formatTotal>0?(formatPass/formatTotal*100).toFixed(0):0}%</td></tr>
            </tbody></table>`;
            if (failDetails.length > 0) {
                resultHtml += `<div style="margin-top:0.8rem;"><strong>❌ 未达标明细</strong><table class="report-table"><thead><tr><th>字段</th><th>问题描述</th></tr></thead><tbody>`;
                failDetails.slice(0,5).forEach(f => { resultHtml += `<tr class="fail-item"><td>${escapeHtml(f.field)}</td><td>${escapeHtml(f.issue)}</td></tr>`; });
                resultHtml += `</tbody></table></div>`;
            }
            resultHtml += `<div class="info-note">💡 建议：根据未达标明细调整字段定义或修改标准约束。</div>`;
            document.getElementById('complianceResult').innerHTML = resultHtml;
        });
    }

            else if (activeModalTab === 'security') modalBody.innerHTML = securityHtml;
            document.querySelectorAll('.edit-modal-tab').forEach(t => {
                if (t.dataset.modalTab === activeModalTab) t.classList.add('active');
                else t.classList.remove('active');
            });
        }
        const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
        overlay.innerHTML = `
            <div class="modal-container">
                <div class="modal-header"><span>✏️ 编辑标准：${escapeHtml(std.name)} (${std.version})</span><button class="closeModalBtn" style="background:none; border:none; font-size:1.4rem; cursor:pointer;">&times;</button></div>
                <div class="modal-tabs edit-modal-tabs">
                    <div class="modal-tab edit-modal-tab active" data-modal-tab="basic">基本信息</div>
                    <div class="modal-tab edit-modal-tab" data-modal-tab="business">业务属性</div>
                    <div class="modal-tab edit-modal-tab" data-modal-tab="tech">技术属性</div>
                    <div class="modal-tab edit-modal-tab" data-modal-tab="manage">管理属性</div>
                    <div class="modal-tab edit-modal-tab" data-modal-tab="security">安全属性</div>
                </div>
                <div class="modal-body" id="editModalBody"></div>
                <div class="modal-footer"><button class="btn-secondary" id="modalCancelBtn">取消</button><button class="btn-primary" id="modalSaveBtn">保存修改</button></div>
            </div>
        `;
        document.body.appendChild(overlay);
        renderModalContent();
        overlay.querySelectorAll('.edit-modal-tab').forEach(tab => {
            tab.addEventListener('click', () => { activeModalTab = tab.dataset.modalTab; renderModalContent(); });
        });
        overlay.querySelector('.closeModalBtn').addEventListener('click', () => overlay.remove());
        overlay.querySelector('#modalCancelBtn').addEventListener('click', () => overlay.remove());
        overlay.querySelector('#modalSaveBtn').addEventListener('click', () => {
            std.name = overlay.querySelector('#modal_name').value;
            std.englishName = overlay.querySelector('#modal_englishName').value;
            std.code = overlay.querySelector('#modal_code').value;
            std.description = overlay.querySelector('#modal_description').value;
            std.business = { definition: overlay.querySelector('#modal_businessDefinition').value, owner: overlay.querySelector('#modal_businessOwner').value };
            std.tech = {
                dataType: overlay.querySelector('#modal_dataType').value, length: overlay.querySelector('#modal_length').value,
                precision: overlay.querySelector('#modal_precision').value, format: overlay.querySelector('#modal_format').value,
                required: overlay.querySelector('#modal_required').value, unique: overlay.querySelector('#modal_unique').value,
                valueRange: overlay.querySelector('#modal_valueRange').value
            };
            std.manage = { department: overlay.querySelector('#modal_department').value, manager: overlay.querySelector('#modal_manager').value };
            std.security = { level: overlay.querySelector('#modal_securityLevel').value };
            renderStandardList();
            renderCurrentTab();
            overlay.remove();
            alert("✅ 标准已更新");
        });
    }

    // Tab切换
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentTab = tab.dataset.tab;
            renderCurrentTab();
        });
    });

    document.getElementById('createStandardBtn').addEventListener('click', openCreateDialog);
    renderStandardList();
    renderCurrentTab();
</script>
</body>
</html>
